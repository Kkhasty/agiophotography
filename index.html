    const GOOGLE_APPS_SCRIPT_CODE = "/**\n * AGIO PHOTOGRAPHY - GOOGLE SHEETS BACKEND + AUTHENTICATED HTML SERVICE BRIDGE\n * Deployment: Execute as the owner. Anyone may load the bridge URL, but every\n * private API action requires a server-issued session token and role check.\n * Configure ALLOWED_ORIGINS and the one-time initial admin credentials below.\n */\nconst AGIO = {\n  SHEETS: ['Bookings','Customers','Staff','Services','Photographers','Payments','Inquiries','Reviews','BlockedSlots','Settings'],\n  ALLOWED_ORIGINS: ['https://YOUR-GITHUB-USERNAME.github.io'], // Add your exact website origin/custom domain.\n  INITIAL_ADMIN_EMAIL: 'CHANGE-THIS-EMAIL@example.com',\n  INITIAL_ADMIN_PASSWORD: 'CHANGE-THIS-TO-A-LONG-ONE-TIME-PASSWORD',\n  SESSION_SECONDS: 21600,\n  HASH_ROUNDS: 4000\n};\n\nfunction doGet(e) {\n  if (e && e.parameter && e.parameter.bridge === '1') {\n    return HtmlService.createHtmlOutput(bridgeHtml_())\n      .setTitle('Agio Secure API Bridge')\n      .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);\n  }\n  return json_({ok:true, service:'Agio Photography API', message:'Use the website login and booking interface.'});\n}\n\nfunction doPost() {\n  return json_({ok:false,error:'Direct requests are not supported. Use the secure website bridge.'});\n}\n\nfunction initializeAgioSheets() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  AGIO.SHEETS.forEach(function(name) {\n    let sh = ss.getSheetByName(name);\n    if (!sh) sh = ss.insertSheet(name);\n    if (sh.getLastRow() === 0) sh.appendRow(['ID','JSON_RECORD','UPDATED_AT']);\n    sh.setFrozenRows(1);\n  });\n  const staff = ss.getSheetByName('Staff');\n  if (staff.getLastRow() < 2) {\n    if (AGIO.INITIAL_ADMIN_EMAIL.indexOf('CHANGE-THIS') === 0 || AGIO.INITIAL_ADMIN_PASSWORD.indexOf('CHANGE-THIS') === 0 || AGIO.INITIAL_ADMIN_PASSWORD.length < 14) {\n      throw new Error('Edit AGIO.INITIAL_ADMIN_EMAIL and AGIO.INITIAL_ADMIN_PASSWORD first. Use a unique password of at least 14 characters.');\n    }\n    const salt = Utilities.getUuid() + Utilities.getUuid();\n    const admin = {id:Utilities.getUuid(),name:'Studio Administrator',email:AGIO.INITIAL_ADMIN_EMAIL.toLowerCase(),role:'Super Administrator',active:true,salt:salt,passwordHash:hashPassword_(AGIO.INITIAL_ADMIN_PASSWORD,salt),photographerId:'',createdAt:new Date().toISOString()};\n    staff.appendRow([admin.id,JSON.stringify(admin),new Date().toISOString()]);\n  }\n  PropertiesService.getScriptProperties().setProperty('AGIO_SETUP_COMPLETE','true');\n  return 'Agio Sheets initialized. Initial administrator account created if Staff was empty.';\n}\n\nfunction apiDispatch(action, payload) {\n  payload = payload || {};\n  try {\n    switch (String(action || '')) {\n      case 'login': return login_(payload);\n      case 'logout': return logout_(payload);\n      case 'publicCatalog': return publicCatalog_();\n      case 'bootstrapData': return bootstrapData_(payload.token, payload.data || {});\n      case 'createBooking': return createBooking_(payload.record || {});\n      case 'listBookings': return listBookings_(payload.token);\n      case 'updateBooking': return updateBooking_(payload.token, payload.id, payload.patch || {});\n      case 'listStaff': return listStaff_(payload.token);\n      case 'createStaff': return createStaff_(payload.token, payload.staff || {});\n      case 'setStaffActive': return setStaffActive_(payload.token, payload.id, payload.active === true);\n      case 'saveCollection': return saveCollection_(payload.token, payload.name, payload.records || []);\n      case 'getCollection': return getCollection_(payload.token, payload.name);\n      default: return {ok:false,error:'Unknown API action.'};\n    }\n  } catch (err) {\n    return {ok:false,error:String(err && err.message ? err.message : err)};\n  }\n}\n\nfunction bootstrapData_(token, data) {\n  const user=requireSession_(token); requireAdmin_(user);\n  const allowed={Services:data.services||[],Photographers:data.photographers||[],Reviews:data.reviews||[],BlockedSlots:data.blockedSlots||[],Inquiries:data.inquiries||[],Settings:data.settings?[Object.assign({id:'studio_settings'},data.settings)]:[]};\n  if(readRecords_('Bookings').length===0 && Array.isArray(data.bookings)) data.bookings.forEach(function(r){if(r&&r.id)upsertRecord_('Bookings',String(r.id),r);});\n  if(readRecords_('Customers').length===0 && Array.isArray(data.customers)) data.customers.forEach(function(r){if(r&&r.id)upsertRecord_('Customers',String(r.id),r);});\n  Object.keys(allowed).forEach(function(name){\n    if(readRecords_(name).length===0 && Array.isArray(allowed[name]) && allowed[name].length){\n      allowed[name].forEach(function(record){const id=String(record.id||Utilities.getUuid());record.id=id;upsertRecord_(name,id,record);});\n    }\n  });\n  return {ok:true,collections:{\n    Services:readRecords_('Services').map(function(x){return x.record;}),\n    Photographers:readRecords_('Photographers').map(function(x){return x.record;}),\n    Reviews:readRecords_('Reviews').map(function(x){return x.record;}),\n    BlockedSlots:readRecords_('BlockedSlots').map(function(x){return x.record;}),\n    Inquiries:readRecords_('Inquiries').map(function(x){return x.record;}),\n    Customers:readRecords_('Customers').map(function(x){return x.record;}),\n    Settings:readRecords_('Settings').map(function(x){return x.record;}),\n    Bookings:readRecords_('Bookings').map(function(x){return x.record;})\n  }};\n}\n\nfunction login_(p) {\n  const email = String(p.email || '').trim().toLowerCase();\n  const password = String(p.password || '');\n  if (!email || !password || password.length > 256) return {ok:false,error:'Enter your email and password.'};\n  const cache=CacheService.getScriptCache();\n  const attemptKey='agio_login_fail_' + sha256_(email);\n  const attempts=Number(cache.get(attemptKey)||0);\n  if(attempts>=8) return {ok:false,error:'Too many failed attempts. Wait 15 minutes before trying again.'};\n  const user = findStaffByEmail_(email);\n  if (!user || user.active !== true || hashPassword_(password,user.salt) !== user.passwordHash) {\n    cache.put(attemptKey,String(attempts+1),900);\n    return {ok:false,error:'Invalid login details or inactive account.'};\n  }\n  cache.remove(attemptKey);\n  const token = Utilities.getUuid() + Utilities.getUuid();\n  const session = {userId:user.id,email:user.email,name:user.name,role:user.role,photographerId:user.photographerId || '',issuedAt:Date.now()};\n  CacheService.getScriptCache().put('agio_session_' + sha256_(token),JSON.stringify(session),AGIO.SESSION_SECONDS);\n  return {ok:true,token:token,user:{id:user.id,name:user.name,email:user.email,role:user.role,photographerId:user.photographerId || ''},expiresIn:AGIO.SESSION_SECONDS};\n}\n\nfunction logout_(p) {\n  if (p.token) CacheService.getScriptCache().remove('agio_session_' + sha256_(String(p.token)));\n  return {ok:true};\n}\n\nfunction createBooking_(record) {\n  const required = ['bookingRef','clientName','clientEmail','clientPhone','date','startTime','endTime','serviceId','photographerId'];\n  required.forEach(function(k){ if (!record[k]) throw new Error('Booking is missing ' + k + '.'); });\n  if (!/^\\S+@\\S+\\.\\S+$/.test(String(record.clientEmail))) throw new Error('Enter a valid email address.');\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(String(record.date))) throw new Error('Invalid booking date.');\n  if (!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(String(record.startTime)) || !/^([01]\\d|2[0-3]):[0-5]\\d$/.test(String(record.endTime)) || String(record.endTime)<=String(record.startTime)) throw new Error('Invalid booking time.');\n  if (String(record.date) < Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd')) throw new Error('Bookings cannot be made for a past date.');\n  const services=readRecords_('Services').map(function(x){return x.record;});\n  const service=services.find(function(x){return x.id===String(record.serviceId);});\n  if (services.length && (!service || service.active===false)) throw new Error('The selected photography package is unavailable.');\n  if (service) {\n    const selectedIds=(record.addons||[]).map(function(a){return a.id;});\n    const addonTotal=(service.addons||[]).filter(function(a){return selectedIds.indexOf(a.id)>=0;}).reduce(function(sum,a){return sum+Number(a.price||0);},0);\n    const trustedTotal=Number(service.price||0)+addonTotal;\n    record.totalAmount=trustedTotal;\n    record.durationMinutes=Number(service.durationMinutes||service.duration||record.durationMinutes||60);\n    record.depositAmount=Math.round(trustedTotal*Number(service.depositPercent||40)/100);\n    record.amountPaid=0;\n    record.balanceRemaining=trustedTotal;\n  }\n  const photographers=readRecords_('Photographers').map(function(x){return x.record;});\n  const photographer=photographers.find(function(x){return x.id===String(record.photographerId);});\n  if (photographers.length && (!photographer || photographer.active===false)) throw new Error('The selected photographer is unavailable.');\n  if (photographer && photographer.workingHours) {\n    const day=new Date(String(record.date)+'T12:00:00').getDay();\n    const hours=photographer.workingHours[day];\n    const toMin=function(t){const parts=String(t||'').split(':');return Number(parts[0])*60+Number(parts[1]);};\n    const start=toMin(record.startTime), end=toMin(record.endTime);\n    if (!hours || !hours.active || start<toMin(hours.start) || end>toMin(hours.end)) throw new Error('The selected time is outside this photographer\u2019s working hours.');\n    if (Number(record.durationMinutes||60)<360 && hours.breakStart && hours.breakEnd && start<toMin(hours.breakEnd) && toMin(hours.breakStart)<end) throw new Error('The selected time overlaps the photographer\u2019s break.');\n    record.photographerName=photographer.name;\n  }\n  const throttleKey='agio_booking_' + sha256_(String(record.clientEmail).toLowerCase());\n  const cache=CacheService.get ew Error('You are not allowed to update this booking.');\n  if (user.role === 'Staff' && row.assignedStaffId !== user.userId) throw new Error('You are not allowed to update this booking.');\n  const allowed = user.role === 'Super Administrator' || user.role === 'Administrator'\n    ? ['status','photographerId','photographerName','specialRequirements','internalNotes','assignedStaffId','paymentStatus','amountPaid','balanceRemaining']\n    : ['status','internalNotes'];\n  Object.keys(patch).forEach(function(k){if (allowed.indexOf(k) >= 0) row[k]=patch[k];});\n  row.updatedAt = new Date().toISOString();\n  upsertRecord_('Bookings',id,row);\n  return {ok:true,record:row};\n}\n\nfunction listStaff_(token) {\n  const user = requireSession_(token);\n  requireAdmin_(user);\n  const records = readRecords_('Staff').map(function(x){\n    const u=x.record; return {id:u.id,name:u.name,email:u.email,role:u.role,active:u.active,photographerId:u.photographerId || ''};\n  });\n  return {ok:true,records:records};\n}\n\nfunction createStaff_(token,staff) {\n  const user=requireSession_(token); requireAdmin_(user);\n  const email=String(staff.email||'').trim().toLowerCase();\n  const password=String(staff.password||'');\n  const name=String(staff.name||'').trim();\n  const role=String(staff.role||'');\n  if (!name || !/^\\S+@\\S+\\.\\S+$/.test(email)) throw new Error('Enter a valid staff name and email.');\n  if (password.length < 14) throw new Error('Temporary password must contain at least 14 characters.');\n  if (['Administrator','Photographer','Staff'].indexOf(role)<0) throw new Error('Invalid staff role.');\n  if (role==='Administrator' && user.role!=='Super Administrator') throw new Error('Only the Super Administrator can create another Administrator.');\n  if (findStaffByEmail_(email)) throw new Error('An account with that email already exists.');\n  const salt=Utilities.getUuid()+Utilities.getUuid();\n  const record={id:Utilities.getUuid(),name:name,email:email,role:role,active:true,salt:salt,passwordHash:hashPassword_(password,salt),photographerId:String(staff.photographerId||''),createdAt:new Date().toISOString()};\n  upsertRecord_('Staff',record.id,record);\n  return {ok:true,staff:{id:record.id,name:record.name,email:record.email,role:record.role,active:true,photographerId:record.photographerId}};\n}\n\nfunction setStaffActive_(token,id,active) {\n  const user=requireSession_(token); requireAdmin_(user);\n  const row=findRecord_('Staff',id); if(!row) throw new Error('Staff account not found.');\n  if(row.role==='Super Administrator' && !active) throw new Error('Use a separate administrator account before disabling the primary account.');\n  row.active=active; row.updatedAt=new Date().toISOString(); upsertRecord_('Staff',id,row);\n  return {ok:true};\n}\n\nfunction saveCollection_(token,name,records) {\n  const user=requireSession_(token); requireAdmin_(user);\n  const allowed=['Services','Photographers','Payments','Inquiries','Reviews','BlockedSlots','Settings'];\n  if(allowed.indexOf(name)<0) throw new Error('Collection is not writable.');\n  if(!Array.isArray(records) || records.length>2000) throw new Error('Invalid collection.');\n  records.forEach(function(r){const id=String(r.id||Utilities.getUuid()); r.id=id; upsertRecord_(name,id,r);});\n  return {ok:true,count:records.length};\n}\n\nfunction getCollection_(token,name) {\n  const user=requireSession_(token);\n  if(['Super Administrator','Administrator'].indexOf(user.role)<0) throw new Error('Not authorized.');\n  const allowed=['Customers','Services','Photographers','Payments','Inquiries','Reviews','BlockedSlots','Settings'];\n  if(allowed.indexOf(name)<0) throw new Error('Collection is not available.');\n  return {ok:true,records:readRecords_(name).map(function(x){return x.record;})};\n}\n\nfunction publicCatalog_() {\n  const services=readRecords_('Services').map(function(x){const r=x.record; return {id:r.id,name:r.name,title:r.title,description:r.description,price:r.price,duration:r.duration,durationMinutes:r.durationMinutes,imageUrl:r.imageUrl,category:r.category,features:r.features,addons:r.addons,active:r.active};});\n  const photographers=readRecords_('Photographers').map(function(x){const r=x.record; return {id:r.id,name:r.name,title:r.title,bio:r.bio,photoUrl:r.photoUrl,specialties:r.specialties,active:r.active,workingHours:r.workingHours};});\n  return {ok:true,data:{Services:services,Photographers:photographers}};\n}\n\nfunction requireSession_(token) {\n  if (!token) throw new Error('Please sign in again.');\n  const raw=CacheService.getScriptCache().get('agio_session_' + sha256_(String(token)));\n  if (!raw) throw new Error('Your session has expired. Please sign in again.');\n  return JSON.parse(raw);\n}\nfunction requireAdmin_(u){if(['Super Administrator','Administrator'].indexOf(u.role)<0) throw new Error('Administrator permission required.');}\nfunction findStaffByEmail_(email){return readRecords_('Staff').map(function(x){return x.record;}).find(function(u){return String(u.email||'').toLowerCase()===email;})||null;}\nfunction upsertCustomer_(b){\n  const email=String(b.clientEmail).toLowerCase(); const found=readRecords_('Customers').find(function(x){return String(x.record.email||'').toLowerCase()===email;});\n  const c=found?found.record:{id:Utilities.getUuid(),name:b.clientName,email:email,phone:b.clientPhone,totalBookings:0,createdAt:new Date().toISOString()};\n  c.name=b.clientName; c.phone=b.clientPhone; c.lastBookingDate=b.date; c.totalBookings=Number(c.totalBookings||0)+1; c.preferredService=b.serviceName||'';\n  upsertRecord_('Customers',c.id,c);\n}\nfunction sheet_(name){const sh=SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name); if(!sh) throw new Error('Missing sheet '+name+'. Run initializeAgioSheets().'); return sh;}\nfunction readRecords_(name){const sh=sheet_(name); const n=sh.getLastRow(); if(n<2)return []; return sh.getRange(2,1,n-1,3).getValues().filter(function(r){return r[0]&&r[1];}).map(function(r){try{return {id:String(r[0]),record:JSON.parse(r[1])};}catch(e){return null;}}).filter(Boolean);}\nfunction findRecord_(name,id){const x=readRecords_(name).find(function(v){return v.id===String(id);}); return x?x.record:null;}\nfunction upsertRecord_(name,id,record){const sh=sheet_(name); const n=sh.getLastRow(); if(n>=2){const ids=sh.getRange(2,1,n-1,1).getValues().flat(); const i=ids.findIndex(function(v){return String(v)===String(id);}); if(i>=0){sh.getRange(i+2,1,1,3).setValues([[String(id),JSON.stringify(record),new Date().toISOString()]]);return;}} sh.appendRow([String(id),JSON.stringify(record),new Date().toISOString()]);}\nfunction overlaps_(s1,e1,s2,e2){return String(s1)<String(e2)&&String(s2)<String(e1);}\nfunction hashPassword_(password,salt){let value=salt+':'+password; for(let i=0;i<AGIO.HASH_ROUNDS;i++) value=sha256_(value); return value;}\nfunction sha256_(value){const bytes=Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,String(value),Utilities.Charset.UTF_8); return Utilities.base64EncodeWebSafe(bytes);}\nfunction json_(obj){return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);}\nfunction bridgeHtml_(){\n  const allowed=JSON.stringify(AGIO.ALLOWED_ORIGINS);\n  return '<!doctype html><html><head><base target=\"_top\"></head><body><script>'+\n    'const ALLOWED='+allowed+';let PARENT_ORIGIN=\"\";'+\n    'window.addEventListener(\"message\",function(e){if(ALLOWED.indexOf(e.origin)<0)return;PARENT_ORIGIN=e.origin;const m=e.data||{};if(m.type!==\"AGIO_API\"||!m.id)return;google.script.run.withSuccessHandler(function(result){parent.postMessage({type:\"AGIO_RESULT\",id:m.id,result:result},PARENT_ORIGIN);}).withFailureHandler(function(err){parent.postMessage({type:\"AGIO_RESULT\",id:m.id,result:{ok:false,error:String(err&&err.message||err)}},PARENT_ORIGIN);}).apiDispatch(m.action,m.payload||{});});'+\n    'parent.postMessage({type:\"AGIO_BRIDGE_READY\"},\"*\");</scr'+'ipt></body></html>';\n}\n";

        AGIO_BRIDGE_FRAME.style.cssText = 'position:absolute;width:1px;height:1px;left:-10000px;top:-10000px;border:0;';
        AGIO_BRIDGE_FRAME.dataset.baseUrl = url;

      async apiCall(action, payload = {}) {
        this.ensureBridge();
        const id = 'agio_' + (++AGIO_CALL_SEQUENCE) + '_' + Date.now();
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => { AGIO_PENDING_CALLS.delete(id); reject(new Error('Google Sheets connection timed out. Check the Apps Script deployment and allowed website origin.')); }, 20000);
          AGIO_PENDING_CALLS.set(id, { resolve, reject, timer });
          const send = () => {
            if (!AGIO_BRIDGE_READY) { setTimeout(send, 150); return; }
            AGIO_BRIDGE_FRAME.contentWindow.postMessage({ type: 'AGIO_API', id, action, payload }, '*');
          };
          send();
        });
      },

      // =======================================================================
      // 4. REAL-TIME SLOT AVAILABILITY & DOUBLE-BOOKING PREVENTION ENGINE
      // =======================================================================
      timeToMins(t) {
        if (!t) return 0;
        const [h, m] = t.split(':').map(Number);
        return h * 60 + m;
      },
      minsToTime(mins) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      },
      formatTime12(t24) {
        if (!t24) return '';
        const [h, m] = t24.split(':').map(Number);
        const suffix = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 === 0 ? 12 : h % 12;
        return `${h12}:${String(m).padStart(2, '0')} ${suffix}`;
      },
      getSlotsForPhotographer(dateStr, durationMins, photog, excludeApptId = null) {
        if (!dateStr || !photog) return [];
        const dayOfWeek = new Date(dateStr + 'T00:00:00').getDay();
        const wh = photog.workingHours?.[dayOfWeek];
        if (!wh || !wh.active) return [];

        const dayBlocks = this.state.blockedSlots.filter(
          (b) => b.date === dateStr && (b.photographerId === 'all' || b.photographerId === photog.id)
        );
        if (dayBlocks.some((b) => b.fullDay)) return [];

        const startMin = this.timeToMins(wh.start);
        const endMin = this.timeToMins(wh.end);
        const bStart = wh.breakStart ? this.timeToMins(wh.breakStart) : null;
        const bEnd = wh.breakEnd ? this.timeToMins(wh.breakEnd) : null;

        const existing = this.state.appointments.filter(
          (a) => a.date === dateStr && a.photographerId === photog.id && a.status !== 'Cancelled' && a.id !== excludeApptId
        );

        const slots = [];
        for (let cur = startMin; cur + durationMins <= endMin; cur += 30) {
          const slotEnd = cur + durationMins;
          let conflict = false;
          let reason = '';

          // Full-day coverage may span the photographer's normal lunch break.
          // Shorter sessions must avoid the break window.
          if (durationMins < 360 && bStart !== null && bEnd !== null && cur < bEnd && slotEnd > bStart) {
            conflict = true;
            reason = 'Staff Break';
          }
          if (!conflict) {
            for (const blk of dayBlocks) {
              if (!blk.fullDay && blk.startTime && blk.endTime) {
                if (cur < this.timeToMins(blk.endTime) && slotEnd > this.timeToMins(blk.startTime)) {
                  conflict = true;
                  reason = blk.reason || 'Blocked';
                  break;
                }
              }
            }
          }
          if (!conflict) {
            for (const ap of existing) {
              const aS = this.timeToMins(ap.startTime);
              const aE = aS + Number(ap.durationMinutes || 60);
              if (cur < aE && slotEnd > aS) {
                conflict = true;
                reason = 'Booked';
                break;
              }
            }
          }

          slots.push({
            startTime: this.minsToTime(cur),
            endTime: this.minsToTime(slotEnd),
            available: !conflict,
            reason,
            photographerId: photog.id,
            photographerName: photog.name
          });
        }
        return slots;
      },

                    <button onclick="if(!app.bookingDraft.clientName||!app.bookingDraft.clientEmail||!app.bookingDraft.clientPhone){app.toast('Please fill in name, email, and phone','error');return;} app.bookingDraft.step=5; app.render()" class="px-7 py-3 rounded-xl bg-[#141414] text-white text-xs font-semibold uppercase tracking-wider">Review &amp; Checkout →</button>

      toggleAddon(id) {
        const idx = this.bookingDraft.addonIds.indexOf(id);
        if (idx >= 0) this.bookingDraft.addonIds.splice(idx, 1);
        else this.bookingDraft.addonIds.push(id);
        this.render();
      },

      selectBookingSlot(idx) {
        const d = this.bookingDraft;
        const srv = this.state.services.find((x) => x.id === d.serviceId) || this.state.services[0];
        const eligible = (srv?.photographerIds?.length) ? this.state.photographers.filter((p) => srv.photographerIds.includes(p.id)) : this.state.photographers;
        let slots = [];
        if (d.photographerId !== 'any') {
          const p = eligible.find((x) => x.id === d.photographerId) || eligible[0];
          slots = this.getSlotsForPhotographer(d.date, srv.durationMinutes || 60, p).filter((sl) => sl.available);
        } else {
          const map = new Map();
          eligible.forEach((p) => {
            this.getSlotsForPhotographer(d.date, srv.durationMinutes || 60, p).filter((sl) => sl.available).forEach((sl) => {
              if (!map.has(sl.startTime)) map.set(sl.startTime, sl);
            });
          });
          slots = Array.from(map.values()).sort((a, b) => a.startTime.localeCompare(b.startTime));
        }
        d.slot = slots[idx];
        this.render();
      },

      async finalizeBooking() {
        const d = this.bookingDraft;
        const srv = this.state.services.find((x) => x.id === d.serviceId) || this.state.services[0];
        const selectedAddons = (srv?.addons || []).filter((a) => d.addonIds.includes(a.id));
        const totalAmount = Number(srv.price) + selectedAddons.reduce((s, a) => s + Number(a.price), 0);
        const depositAmount = Math.round((totalAmount * (srv.depositPercent || 40)) / 100);
        const dueNow = d.paymentOption === 'full' ? totalAmount : depositAmount;
        const hasReference = Boolean(d.gatewayRef.trim());
        const amountPaid = 0; // A reference entered by a customer is not proof of payment.
        const balanceRemaining = totalAmount - amountPaid;
        const bookingRef = 'LUM-' + Math.random().toString(36).substring(2, 7).toUpperCase();

        const record = {
          id: 'appt_' + Date.now(),
          bookingRef,
          serviceId: srv.id,
          serviceName: srv.name,
          durationMinutes: srv.durationMinutes || 60,
          addons: selectedAddons,
          photographerId: d.slot.photographerId,
          photographerName: d.slot.photographerName,
          locationType: d.locationType,
          locationAddress: d.locationType === 'In-Studio' ? this.state.settings.address : d.locationAddress,
          date: d.date,
          startTime: d.slot.startTime,
          endTime: d.slot.endTime,
          clientName: d.clientName.trim(),
          clientEmail: d.clientEmail.trim(),
          clientPhone: d.clientPhone.trim(),
          specialRequirements: d.specialRequirements.trim(),
          referenceImageUrls: d.referenceImageUrls.split(',').map((x) => x.trim()).filter(Boolean),
          totalAmount,
          depositAmount,
          amountPaid,
          balanceRemaining,
          paymentGateway: d.gateway,
          gatewayReference: d.gatewayRef.trim() || null,
          paymentStatus: hasReference ? 'Pending Verification' : 'Pending Payment',
          status: 'Pending',
          createdAt: new Date().toISOString()
        };

        // Store every public booking in the central Google Sheets database.
        try {
          const saved = await this.apiCall('createBooking', { record });
          if (!saved.ok) throw new Error(saved.error || 'The booking could not be saved.');
          Object.assign(record, saved.record || {});
        } catch (err) {
          this.toast(err.message || 'Could not save booking to Google Sheets. Please try again.', 'error');
          return;
        }
        this.state.appointments.unshift(record);

        // Upsert Customer CRM
        const exCust = this.state.customers.find((c) => c.email.toLowerCase() === record.clientEmail.toLowerCase());
        if (exCust) {
          exCust.totalBookings = (exCust.totalBookings || 1) + 1;
          exCust.lastBookingDate = record.date;
        } else {
          this.state.customers.unshift({
            id: 'cust_' + Date.now(),
            name: record.clientName,
            email: record.clientEmail,
            phone: record.clientPhone,
            preferredService: record.serviceName,
            lastBookingDate: record.date,
            totalBookings: 1,
            notes: record.specialRequirements
          });
        }

        this.saveLocal();
        d.confirmedBooking = record;
        this.toast(`Booking ${bookingRef} saved to Agio's booking database.`);
        this.render();
      },

          Object.assign(a, result.record || { status });
          this.toast(`Booking ${a.bookingRef} marked ${status}`);

      saveVerifiedPayment(e, id) {
        e.preventDefault();
        this.toast('Payment recording is disabled until an authenticated backend verifies and authorizes the transaction.', 'error');
        return false;
        const fd = new FormData(e.target);
        const a = this.state.appointments.find((x) => x.id === id);
        if (!a) return;
        const amt = Number(fd.get('amount'));
        const method = String(fd.get('method') || '').trim();
        const reference = String(fd.get('reference') || '').trim();
        const remaining = Number(a.balanceRemaining ?? (Number(a.totalAmount) - Number(a.amountPaid || 0)));
        if (!Number.isFinite(amt) || amt <= 0 || amt > remaining) {
          this.toast('Enter a valid amount that does not exceed the outstanding balance.', 'error');
          return;
        }
        if (!reference || !method) {
          this.toast('Payment method and transaction reference are required.', 'error');
          return;
        }
        const duplicate = this.state.appointments.some((item) =>
          (item.gatewayReference && String(item.gatewayReference).toLowerCase() === reference.toLowerCase()) ||
          (item.paymentHistory || []).some((payment) => String(payment.reference || '').toLowerCase() === reference.toLowerCase())
        );
        if (duplicate) {
          this.toast('This transaction reference has already been recorded.', 'error');
          return;
        }
        a.amountPaid = Number(a.amountPaid || 0) + amt;
        a.balanceRemaining = Math.max(0, Number(a.totalAmount) - a.amountPaid);
        a.paymentStatus = a.balanceRemaining === 0 ? 'Paid in Full' : 'Deposit Paid';
        a.paymentHistory = [...(a.paymentHistory || []), { amount: amt, method, reference, recordedAt: new Date().toISOString(), recordedBy: this.role || 'Administrator' }];
        if (a.status === 'Pending') a.status = 'Confirmed';
        this.saveLocal();
        this.closeModal();
        this.toast('Payment recorded. Ensure the transaction was independently verified.');
        this.render();
      },

        return `
          <form onsubmit="app.saveSettingsForm(event)" class="space-y-6 max-w-4xl">
            <div class="flex justify-between items-center">
              <h1 class="font-serif-editorial text-2xl font-semibold">Branding, Gateways &amp; Google Sheets</h1>
              <button type="submit" class="px-6 py-2.5 rounded-xl bg-[#141414] text-white text-xs font-semibold uppercase">Save Settings</button>
            </div>

            <div class="bg-emerald-950 text-white p-6 rounded-2xl space-y-3 text-xs">
              <div class="flex justify-between items-center">
                <span class="font-bold uppercase tracking-wider text-emerald-300">Google Sheets Two-Way Database Sync</span>
                <button type="button" onclick="app.openGoogleSheetModal()" class="underline text-emerald-200">View Secure Backend Code.gs</button>
              </div>
              <input name="googleSheetWebAppUrl" value="${this.esc(s.googleSheetWebAppUrl || '')}" placeholder="https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec" class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-emerald-700 text-white font-mono" />
              <div class="flex gap-2">
                <button type="button" onclick="app.refreshStaffBookings()" class="px-4 py-2 rounded-xl bg-emerald-600 font-semibold">Refresh Bookings</button>
                <button type="button" onclick="app.copyAppsScript()" class="px-4 py-2 rounded-xl bg-white/10 font-semibold">Copy Backend Code</button>
              </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-stone-200 space-y-4 text-xs">
              <h3 class="font-serif-editorial text-lg font-semibold">Studio Brand Identity &amp; Policies</h3>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div><label class="block font-semibold mb-1">Studio Name</label><input name="studioName" value="${this.esc(s.studioName)}" class="w-full px-3 py-2 rounded-xl border" /></div>
                <div><label class="block font-semibold mb-1">Accent Color</label><input name="accentColor" type="color" value="${this.esc(s.accentColor)}" class="w-full h-9 rounded-xl border" /></div>
                <div><label class="block font-semibold mb-1">Phone / WhatsApp</label><input name="phone" value="${this.esc(s.phone)}" class="w-full px-3 py-2 rounded-xl border" /></div>
              </div>
              <div><label class="block font-semibold mb-1">Booking Policy</label><textarea name="bookingPolicy" rows="2" class="w-full px-3 py-2 rounded-xl border">${this.esc(s.bookingPolicy)}</textarea></div>
              <div><label class="block font-semibold mb-1">Cancellation Policy</label><textarea name="cancellationPolicy" rows="2" class="w-full px-3 py-2 rounded-xl border">${this.esc(s.cancellationPolicy)}</textarea></div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-stone-200 space-y-4 text-xs">
              <h3 class="font-serif-editorial text-lg font-semibold">Payment Gateway Public Keys</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block font-semibold mb-1">Paystack Public Key</label><input name="paystackPublicKey" value="${this.esc(s.gateways.paystackPublicKey || '')}" class="w-full px-3 py-2 rounded-xl border font-mono" /></div>
                <div><label class="block font-semibold mb-1">Flutterwave Public Key</label><input name="flutterwavePublicKey" value="${this.esc(s.gateways.flutterwavePublicKey || '')}" class="w-full px-3 py-2 rounded-xl border font-mono" /></div>
                <div><label class="block font-semibold mb-1">Stripe Publishable Key</label><input name="stripePublishableKey" value="${this.esc(s.gateways.stripePublishableKey || '')}" class="w-full px-3 py-2 rounded-xl border font-mono" /></div>
                <div><label class="block font-semibold mb-1">PayPal Client ID</label><input name="paypalClientId" value="${this.esc(s.gateways.paypalClientId || '')}" class="w-full px-3 py-2 rounded-xl border font-mono" /></div>
              </div>
            </div>
          </form>
        `;
      },

      saveSettingsForm(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const s = this.state.settings;
        s.studioName = fd.get('studioName');
        s.accentColor = fd.get('accentColor');
        s.phone = fd.get('phone');
        s.bookingPolicy = fd.get('bookingPolicy');
        s.cancellationPolicy = fd.get('cancellationPolicy');
        s.googleSheetWebAppUrl = fd.get('googleSheetWebAppUrl').trim();
        s.gateways.paystackPublicKey = fd.get('paystackPublicKey').trim();
        s.gateways.flutterwavePublicKey = fd.get('flutterwavePublicKey').trim();
        s.gateways.stripePublishableKey = fd.get('stripePublishableKey').trim();
        s.gateways.paypalClientId = fd.get('paypalClientId').trim();
        this.saveLocal(true);
        this.applyBrandTheme();
        this.updateGSheetStatusBadge();
        this.toast('All settings saved!');
        this.render();
      }
    };

    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
